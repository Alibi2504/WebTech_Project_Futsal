<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AITU Futsal member profile">
    <title>Profile | AITU Futsal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container"><a class="navbar-brand" href="index.html"><img src="images/aitu-futsal-logo.jpg"
                                                                          alt="AITU Futsal logo">AITU FUTSAL</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span
                class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto gap-1">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                <li class="nav-item"><a class="nav-link active" href="profile.html">Profile</a></li>
                <li class="nav-item">
                    <button class="nav-link theme-toggle" type="button">Day mode</button>
                </li>
            </ul>
        </div>
    </div>
</nav>
<main>
    <section class="page-banner">
        <div class="container"><span class="eyebrow">Member area</span>
            <h1 class="mt-2">Your Profile</h1>
            <p>Your locally saved registration information.</p></div>
    </section>
    <section class="section">
        <div class="container">
            <div id="profile-details" class="card card-custom p-4 p-lg-5 auth-shell">
                <div class="d-flex flex-wrap justify-content-between gap-3 align-items-start mb-4">
                    <div><span class="eyebrow">AITU Futsal member</span>
                        <h2 id="profile-name" class="mt-2">Loading...</h2></div>
                    <button id="logout-button" class="btn btn-aitu-outline" type="button">Log Out</button>
                </div>
                <dl class="profile-grid">
                    <div class="profile-field">
                        <dt>Email</dt>
                        <dd id="profile-email"></dd>
                    </div>
                    <div class="profile-field">
                        <dt>Phone</dt>
                        <dd id="profile-phone"></dd>
                    </div>
                    <div class="profile-field">
                        <dt>Study year</dt>
                        <dd id="profile-year"></dd>
                    </div>
                    <div class="profile-field">
                        <dt>Position</dt>
                        <dd id="profile-position"></dd>
                    </div>
                    <div class="profile-field" style="grid-column:1/-1">
                        <dt>About</dt>
                        <dd id="profile-about"></dd>
                    </div>
                </dl>
                <a class="btn btn-aitu-primary mt-4" href="events.html">Explore Upcoming Events</a></div>
        </div>
    </section>
</main>
<footer class="site-footer">
    <div class="container"><strong>AITU FUTSAL</strong>
        <p class="mb-0">Astana IT University · Cyber Arena · © 2026</p></div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
